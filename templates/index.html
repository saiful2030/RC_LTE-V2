<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>RC CAR LTE - Independent Speed</title>

    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        img {
            width: 640px;
            max-width: 95%;
            border: 4px solid lime;
        }

        button {
            padding: 15px;
            font-size: 18px;
            margin-top: 15px;
        }

        #status {
            margin-top: 15px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h2>🚗 RC CAR – Independent Left / Right Speed</h2>

    <img id="cam">

    <p>
        Joystick kiri ↑↓ = roda kiri (speed & arah)<br>
        Joystick kanan ↑↓ = roda kanan (speed & arah / D-Pad fallback)<br>
        R2 = MAJU LURUS | L2 = MUNDUR LURUS
    </p>

    <button id="startBtn">🎮 AKTIFKAN GAMEPAD</button>
    <p id="status">Status: Menunggu gamepad…</p>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const cam = document.getElementById("cam");
        const statusText = document.getElementById("status");

        const DEADZONE = 0.2;
        let gamepadIndex = null;
        let lastSend = Date.now();

        /* ===== CAMERA ===== */
        socket.on("video", d => cam.src = "data:image/jpeg;base64," + d);

        /* ===== HELPER ===== */
        function axisToDir(v) {
            if (v < -DEADZONE) return "MAJU";
            if (v > DEADZONE) return "MUNDUR";
            return "STOP";
        }

        function axisToSpeed(v) {
            return Math.round(Math.min(1, Math.abs(v)) * 100);
        }

        function send(leftDir, leftSpd, rightDir, rightSpd) {
            socket.emit(
                "control",
                `LEFT:${leftDir},${leftSpd};RIGHT:${rightDir},${rightSpd}`
            );
            lastSend = Date.now();
        }

        /* ===== GAMEPAD LOOP ===== */
        function pollGamepad() {
            if (gamepadIndex === null) return;

            const gp = navigator.getGamepads()[gamepadIndex];
            if (!gp) return;

            const R2 = gp.buttons[7] && gp.buttons[7].pressed;
            const L2 = gp.buttons[6] && gp.buttons[6].pressed;

            let lDir = "STOP",
                rDir = "STOP";
            let lSpd = 0,
                rSpd = 0;

            /* === OVERRIDE R2 / L2 === */
            if (R2 || L2) {
                const d = R2 ? "MAJU" : "MUNDUR";
                lDir = rDir = d;
                lSpd = rSpd = 100;
            } else {
                /* === LEFT JOYSTICK === */
                const la = gp.axes[1] || 0;
                lDir = axisToDir(la);
                lSpd = axisToSpeed(la);

                /* === RIGHT JOYSTICK / DPAD === */
                let ra = 0;
                if (gp.axes.length > 3 && Math.abs(gp.axes[3]) > 0.05)
                    ra = gp.axes[3];
                else if (gp.buttons[12] && gp.buttons[12].pressed)
                    ra = -1;
                else if (gp.buttons[13] && gp.buttons[13].pressed)
                    ra = 1;

                rDir = axisToDir(ra);
                rSpd = axisToSpeed(ra);
            }

            send(lDir, lSpd, rDir, rSpd);

            statusText.innerText =
                `LEFT : ${lDir} ${lSpd}%\n` +
                `RIGHT: ${rDir} ${rSpd}%\n` +
                `R2:${R2?"ON":"OFF"} L2:${L2?"ON":"OFF"}`;

            requestAnimationFrame(pollGamepad);
        }

        /* ===== FAIL-SAFE CLIENT ===== */
        setInterval(() => {
            if (Date.now() - lastSend > 500) {
                socket.emit("control", "LEFT:STOP,0;RIGHT:STOP,0");
            }
        }, 300);

        /* ===== START ===== */
        document.getElementById("startBtn").onclick = () => {
            const gps = navigator.getGamepads();
            for (let i = 0; i < gps.length; i++) {
                if (gps[i]) {
                    gamepadIndex = i;
                    statusText.innerText = "Gamepad aktif:\n" + gps[i].id;
                    requestAnimationFrame(pollGamepad);
                    return;
                }
            }
            alert("Tekan tombol di gamepad dulu");
        };
    </script>

</body>

</html>
